<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FAKE ESP</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas {
    position: absolute; left: 0; top: 0;
    width: 100%; height: 100%;
    display: block;
  }
  #hud { pointer-events: none; }
  #status {
    position: fixed; left: 10px; bottom: 8px;
    font: 12px/1.45 ui-monospace, Consolas, "Courier New", monospace;
    color: #8fd0ff; text-shadow: 0 0 4px #000, 0 0 2px #000;
    pointer-events: none; white-space: pre; display: none;
  }
  body.show-status #status { display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="hud"></canvas>
<div id="status"></div>
<script src="esp.js"></script>
</body>
</html>
